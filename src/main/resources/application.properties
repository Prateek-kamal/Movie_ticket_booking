spring.application.name=seats

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/seats}
spring.datasource.username=${DB_USER:app}
spring.datasource.password=${DB_PASSWORD:app}
spring.datasource.hikari.maximum-pool-size=20

spring.jackson.property-naming-strategy=SNAKE_CASE

app.admin-token=${ADMIN_TOKEN:admin-secret}

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db